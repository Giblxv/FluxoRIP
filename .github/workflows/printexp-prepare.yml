name: PrintExp path preparation checks

on:
  push:
    branches: [codex/studio-dtf-automatico]
    paths:
      - 'tools/printexp_prepare/**'
      - 'tests/test_printexp_prepare.ps1'
      - 'tests/fixtures/PrintDialogFixture.cs'
      - 'tools/printexp_diagnostic/Read-Win32Controls.ps1'
      - '.github/workflows/printexp-prepare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-path:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile our disposable dialog fixture
        shell: powershell
        run: |
          Add-Type -Path tests/fixtures/PrintDialogFixture.cs -OutputAssembly (Join-Path $env:RUNNER_TEMP 'PrintExp_Fixture.exe') -OutputType WindowsApplication -ReferencedAssemblies System,System.Core,System.Windows.Forms,System.Drawing
      - name: Verify path-only preparation on PowerShell 5.1
        shell: powershell
        run: .\tests\test_printexp_prepare.ps1 -FixtureExe (Join-Path $env:RUNNER_TEMP 'PrintExp_Fixture.exe')
      - name: Verify path-only preparation on PowerShell 7
        shell: pwsh
        run: .\tests\test_printexp_prepare.ps1 -FixtureExe (Join-Path $env:RUNNER_TEMP 'PrintExp_Fixture.exe')
      - name: Package generic helper only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/prepare-package -Force | Out-Null
          Copy-Item tools/printexp_prepare/* work/prepare-package/
          Get-ChildItem work/prepare-package -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } | Set-Content work/prepare-package/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: FluxoRIP-Preparar-Caminho-PrintExp-Ensaio
          path: work/prepare-package/
          retention-days: 14
          if-no-files-found: error

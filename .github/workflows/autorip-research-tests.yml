name: AutoRIP research synthetic tests

on:
  push:
    branches:
      - research/autorizado-autorip-studio
    paths:
      - 'research/autorip-studio/**'
      - 'web/**'
      - '.github/workflows/autorip-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run synthetic-only regression tests
        working-directory: research/autorip-studio
        run: python -m unittest -v test_ternary_transition test_verified_ternary test_verified_cli test_verify_sample_hashes test_modular_holdout_audit test_controlled_capture test_prospective_periodicity
      - name: Windows PowerShell capture smoke (synthetic inputs only)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: research/autorip-studio
        run: ./test_capture_powershell.ps1
      - name: Validate CMYK interface keyboard behavior (synthetic DOM)
        run: node web/test_cmyk_navigation.mjs
      - name: Validate live reduced-motion preferences (synthetic DOM)
        run: node web/test_motion_preference.mjs
      - name: Validate CMYK page motion lifecycle (synthetic DOM)
        run: node web/test_motion_page.mjs
      - name: Check browser script syntax
        run: |
          node --check web/cmyk-navigation.js
          node --check web/motion.js
